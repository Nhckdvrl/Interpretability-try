name: NTSB pre-G0 narrative population

on:
  workflow_dispatch:
  push:
    paths:
      - "phenomenon_miner/ntsb_avall_audit_2026-08-31/TRIGGER_G0_POP"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MDB tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mdbtools unzip

      - name: Download official NTSB avall.zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ntsb
          cd /tmp/ntsb
          URL='https://data.ntsb.gov/avdata/FileDirectory/DownloadFile?fileID=C%3A%5Cavdata%5Cavall.zip'
          curl --fail --location --retry 4 --retry-delay 5 --connect-timeout 30 \
            --output avall.zip "$URL"
          sha256sum avall.zip | tee avall.zip.sha256
          unzip -o avall.zip -d extracted

      - name: Export findings and narratives
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/ntsb
          MDB="$(find extracted -type f \( -iname '*.mdb' -o -iname '*.accdb' \) | head -n 1)"
          test -n "$MDB"
          mdb-tables -1 "$MDB" | tee tables.txt
          FINDINGS="$(awk 'tolower($0)=="findings" {print; exit}' tables.txt)"
          NARRATIVES="$(awk 'tolower($0)=="narratives" {print; exit}' tables.txt)"
          test -n "$FINDINGS"
          test -n "$NARRATIVES"
          mdb-export "$MDB" "$FINDINGS" > findings.csv
          mdb-export "$MDB" "$NARRATIVES" > narratives.csv
          wc -l findings.csv narratives.csv

      - name: Prepare deterministic population
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ntsb/pop
          python phenomenon_miner/ntsb_avall_audit_2026-08-31/prepare_g0_population.py \
            --findings /tmp/ntsb/findings.csv \
            --narratives /tmp/ntsb/narratives.csv \
            --out-dir /tmp/ntsb/pop \
            --manifest-n 300
          cp /tmp/ntsb/avall.zip.sha256 /tmp/ntsb/pop/
          cp /tmp/ntsb/tables.txt /tmp/ntsb/pop/

      - name: Upload pre-G0 population artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ntsb-pre-g0-population-2026-08-31
          path: /tmp/ntsb/pop
          if-no-files-found: error
          retention-days: 30
