[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facts-shortcuts-g0"
version = "0.1.0"
description = "Strict behavioral preflight for factual-vs-shortcut arbitration in entity comparisons"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
facts-shortcuts-g0 = "facts_shortcuts_g0.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
