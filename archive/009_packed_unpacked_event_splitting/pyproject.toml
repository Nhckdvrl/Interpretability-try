[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "packed-unpacked-g0"
version = "0.1.0"
description = "Frozen behavioral validation harness for Packed-Unpacked Event Splitting"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
run = ["torch>=2.4", "transformers>=4.48"]
dev = ["pytest>=8"]

[project.scripts]
packed-unpacked-run = "packed_unpacked_g0.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
