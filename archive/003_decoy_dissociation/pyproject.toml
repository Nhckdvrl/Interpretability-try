[project]
name = "decoy-g0"
version = "0.1.0"
description = "Behavior-first G0 for dominated-decoy preference reversals in open-weight LMs"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "transformers>=4.50",
  "accelerate>=1.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
decoy-generate = "decoy_g0.cli:generate_main"
decoy-run = "decoy_g0.cli:run_main"
decoy-summarize = "decoy_g0.cli:summarize_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decoy_g0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
