[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mixed-status-event-attraction"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
data = ["datasets>=3"]
run = ["torch>=2.4", "transformers>=4.48"]
analysis = ["numpy>=1.26"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
