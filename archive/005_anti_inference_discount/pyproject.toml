[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anti-inference-g0"
version = "0.1.0"
description = "Frozen behavioral G0 for anti-inference discount after successful comprehension"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "transformers>=4.51", "accelerate>=0.30"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
antiinf-generate = "antiinf_g0.cli:generate_main"
antiinf-run = "antiinf_g0.cli:run_main"
antiinf-summarize = "antiinf_g0.cli:summarize_main"

[tool.setuptools.packages.find]
where = ["src"]
