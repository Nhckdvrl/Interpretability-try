[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weak-evidence-backfire-g0"
version = "0.1.0"
description = "Frozen behavioral validation harness for Weak-Evidence Backfire"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
run = ["torch>=2.4", "transformers>=4.48"]
d0 = ["numpy>=1.26", "scikit-learn>=1.4"]
dev = ["pytest>=8", "numpy>=1.26", "scikit-learn>=1.4"]

[project.scripts]
weak-evidence-run = "weak_evidence_g0.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
