[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deontic-facilitation-g0"
version = "0.2.0"
description = "Frozen matched behavioral G0 for deontic facilitation in Wason selection tasks"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "transformers>=4.51", "accelerate>=0.30"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
deontic-generate = "deontic_g0.cli:generate_main"
deontic-run = "deontic_g0.cli:run_main"
deontic-summarize = "deontic_g0.cli:summarize_main"

[tool.setuptools.packages.find]
where = ["src"]
